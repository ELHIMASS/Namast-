# Pile complète du site Namasté sur le NAS : le site et sa base.
#
#   docker compose up -d --build
#
# Les valeurs sensibles sont lues dans un fichier .env placé à côté de ce
# fichier (voir .env.exemple). Ce .env ne doit pas être versionné.

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: namaste
      POSTGRES_USER: namaste
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?mot de passe de la base manquant dans .env}
      # Le fichier clientes est en français : collation et encodage explicites.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      # Montage sur /var/lib/postgresql et non sur .../data : depuis la
      # version 18, l'image range les données dans un sous-dossier propre à la
      # version majeure (18/docker) et refuse de démarrer si elle détecte un
      # montage à l'ancien emplacement. Ce choix permet aussi les futures
      # montées de version avec pg_upgrade.
      - donnees-postgres:/var/lib/postgresql
    # Aucun port publié : la base n'est joignable que par le site, sur le
    # réseau interne de Docker. Rien à exposer vers l'internet.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U namaste -d namaste"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Applique les migrations en attente, puis s'arrête. Construit sur l'étape
  # « builder », la seule à disposer de toutes les dépendances du CLI Prisma :
  # la sortie autonome du site, volontairement minimale, ne les contient pas.
  # `migrate deploy` n'applique que ce qui existe, il ne génère et ne supprime
  # rien : le relancer à chaque démarrage est sans danger.
  migrate:
    build:
      context: .
      target: builder
    command: npx prisma migrate deploy --schema=prisma/schema.prisma
    environment:
      DATABASE_URL: postgresql://namaste:${POSTGRES_PASSWORD}@db:5432/namaste?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: runner
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        # Le site ne démarre qu'une fois les migrations passées.
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://namaste:${POSTGRES_PASSWORD}@db:5432/namaste?schema=public
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?mot de passe de l espace pro manquant dans .env}
      TZ: Europe/Paris
    ports:
      # Exposé sur le NAS uniquement ; c'est le reverse proxy du NAS qui
      # publiera le site en HTTPS vers l'internet.
      - "3000:3000"

volumes:
  donnees-postgres:
