<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Namasté">
  <!-- Monogramme du salon. Le dégradé reprend --primary (#c17a90) et
       --accent (#8a4a5e) de globals.css, la lettre --primary-foreground :
       l'icône reste ainsi cohérente avec l'identité du site.
       La lettre est tracée en chemin et non en texte : les polices ne sont
       pas chargées dans le rendu d'un favicon. -->
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#989077"/>
      <stop offset="1" stop-color="#a97847"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#fond)"/>
  <path fill="#fff8f7"
        d="M14 50 V14 H23 L41 40 V14 H50 V50 H41 L23 24 V50 Z"/>
</svg>
